<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comité — Vespacaution</title>
    
    <!-- jsPDF pour les exports -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
    
    <style>
        body { font-family: sans-serif; background: #f9f7f1; color: #2d2d2d; padding: 20px; max-width: 900px; margin: auto; }
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); margin-bottom: 20px; border: 1px solid #e6e2d8; }
        h1, h2, h3 { color: #c99b48; }
        input, button, select, textarea { padding: 10px; margin: 5px 0; border-radius: 6px; border: 1px solid #ddd; width: 100%; box-sizing: border-box; font-family: inherit; font-size: 14px; }
        textarea { resize: vertical; min-height: 100px; }
        button { background: #c99b48; color: white; font-weight: bold; cursor: pointer; border: none; transition: 0.2s; }
        button:hover { background: #b5883b; }
        .hidden { display: none !important; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; font-size: 14px; }
        th { background: #f4ebd9; }
        .flex { display: flex; gap: 10px; flex-wrap: wrap; }
        .flex > * { flex: 1; min-width: 120px; }
        .btn-red { background: #d9534f; }
        .btn-green { background: #5cb85c; }
        .btn-grey { background: #888; }
        .btn-blue { background: #457b9d; }
        .btn-sm { padding: 5px 10px; font-size: 12px; width: auto; margin: 0; }
        .tabs { display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 2px solid #e6e2d8; padding-bottom: 10px; flex-wrap: wrap; }
        .tab { background: none; color: #6b6b6b; border: none; font-size: 1.1rem; cursor: pointer; padding: 5px 15px; border-radius: 8px; }
        .tab.active { background: #f4ebd9; color: #c99b48; font-weight: bold; }
        .sync-status { font-size: 0.8rem; color: #888; margin-top: 5px; text-align: right; width: 100%; }
    </style>
</head>
<body>

    <div id="authSection" class="card" style="text-align: center;">
        <h1>🔒 <span data-i18n="admin_login_title">Espace Comité</span></h1>
        <p data-i18n="admin_login_desc">Accès réservé aux membres.</p>
        <input type="email" id="email" placeholder="Email (comite@vespacaution.ch)">
        <input type="password" id="password" placeholder="Mot de passe">
        <button onclick="login()" style="margin-top: 15px;" data-i18n="admin_login_btn">Se connecter</button>
        <p id="authMsg" style="color: red; font-weight: bold;"></p>
    </div>

    <div id="appSection" class="hidden">
        <div class="card" style="display:flex; justify-content:space-between; align-items:center; flex-wrap: wrap; gap: 10px;">
            <h1 style="margin:0;" data-i18n="admin_dashboard">Tableau de bord</h1>
            <div style="display: flex; gap: 10px; align-items: center; flex-wrap: wrap;">
                <div id="syncStatus" class="sync-status" data-i18n="admin_sync_ready">Prêt</div>
                <button onclick="syncCloud('save')" class="btn-blue btn-sm" data-i18n="admin_sync_save">☁️ Sauvegarder</button>
                <button onclick="syncCloud('load')" class="btn-green btn-sm" data-i18n="admin_sync_load">☁️ Charger</button>
                <button onclick="logout()" class="btn-red btn-sm" style="width:auto; padding: 10px;" data-i18n="admin_logout">Déconnexion</button>
            </div>
        </div>

        <div class="tabs">
            <button class="tab active" onclick="switchTab('caisse')" data-i18n="admin_tab_caisse">💰 Caisse</button>
            <button class="tab" onclick="switchTab('archives')" data-i18n="admin_tab_archives">📁 Archives</button>
            <button class="tab" onclick="switchTab('editor')" data-i18n="admin_tab_editor">📝 Éditeur</button>
            <button class="tab" onclick="switchTab('blog')" data-i18n="admin_tab_blog">📰 Blog & Membres</button>
        </div>

        <!-- CAISSE -->
        <div id="tabCaisse" class="card">
            <h2 data-i18n="admin_caisse_title">💰 Journal de Caisse</h2>
            <div class="flex">
                <select id="txType" style="flex: 0.8;">
                    <option value="receive" data-i18n="admin_type_receive">🟢 Reçu</option>
                    <option value="spend" data-i18n="admin_type_spend">🔴 Dépense</option>
                </select>
                <input type="date" id="txDate" style="flex: 1;">
                <input type="text" id="txDesc" placeholder="Description" data-i18n-placeholder="admin_desc_placeholder" style="flex: 2;">
                <input type="number" id="txAmount" placeholder="Montant" data-i18n-placeholder="admin_amount_placeholder" style="flex: 1;">
                <button onclick="addTransaction()" style="width: 100px;" data-i18n="admin_add_btn">Ajouter</button>
            </div>
            
            <table id="txTable">
                <thead>
                    <tr>
                        <th data-i18n="admin_table_date">Date</th>
                        <th data-i18n="admin_table_desc">Description</th>
                        <th data-i18n="admin_table_amount">Montant</th>
                        <th data-i18n="admin_table_action">Action</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>

            <div class="flex" style="margin-top: 20px;">
                <button onclick="exportCSV()" class="btn-green" data-i18n="admin_export_csv">📥 Export CSV</button>
                <button onclick="exportPDF()" class="btn-red" data-i18n="admin_export_pdf">📄 Export PDF</button>
            </div>
        </div>

        <!-- ARCHIVES -->
        <div id="tabArchives" class="card hidden">
            <h2 data-i18n="admin_archives_title">📁 Archives</h2>
            <div class="flex" style="margin-bottom: 20px;">
                <input type="text" id="newFolderName" placeholder="Nom du dossier" data-i18n-placeholder="admin_folder_placeholder">
                <button onclick="createFolder()" style="width: 150px;" data-i18n="admin_create_folder">Créer dossier</button>
            </div>
            <div class="flex" style="margin-bottom: 20px;">
                <input type="file" id="fileUpload" accept=".pdf,.doc,.docx,.txt" style="display:none;" onchange="uploadFile(event)">
                <button onclick="document.getElementById('fileUpload').click()" class="btn-blue" data-i18n="admin_import_file">📤 Importer fichier</button>
            </div>
            <div id="foldersContainer"></div>
        </div>

        <!-- ÉDITEUR DE TEXTE -->
        <div id="tabEditor" class="card hidden">
            <h2 data-i18n="admin_editor_title">📝 Éditeur de texte</h2>
            <div class="flex">
                <select id="editorFolder">
                    <option value="Général" data-i18n="admin_general_folder">Général</option>
                </select>
                <input type="text" id="editorTitle" placeholder="Titre du document" data-i18n-placeholder="admin_title_placeholder">
            </div>
            <textarea id="editorContent" placeholder="Écrivez votre texte ici..." data-i18n-placeholder="admin_text_placeholder"></textarea>
            <button onclick="saveTextDoc()" class="btn-green" style="margin-top: 10px;" data-i18n="admin_save_doc">💾 Enregistrer le document</button>
        </div>

        <!-- BLOG & MEMBRES -->
        <div id="tabBlog" class="card hidden">
            <h2 data-i18n="admin_blog_title">📰 Blog & Membres</h2>
            
            <h3 data-i18n="admin_blog_add">Ajouter un article</h3>
            <div class="flex">
                <input type="text" id="blogTitle" placeholder="Titre de l'article" data-i18n-placeholder="admin_blog_title_ph">
            </div>
            <textarea id="blogContent" placeholder="Contenu de l'article..." data-i18n-placeholder="admin_blog_content_ph"></textarea>
            <button onclick="addBlogPost()" class="btn-blue" style="margin-top: 10px;" data-i18n="admin_blog_publish">➕ Publier l'article</button>
            <div id="blogList" style="margin-top: 20px;"></div>

            <hr style="margin: 30px 0; border-top: 1px solid #ddd;">

            <h3 data-i18n="admin_members_add">Mettre à jour les membres</h3>
            <div class="flex">
                <input type="text" id="memberName" placeholder="Nom du membre" data-i18n-placeholder="admin_member_name_ph">
                <input type="text" id="memberRole" placeholder="Rôle (ex: Président)" data-i18n-placeholder="admin_member_role_ph">
            </div>
            <div class="flex">
                <input type="text" id="memberImage" placeholder="Image (ex: ben.png)" data-i18n-placeholder="admin_member_image_ph">
                <select id="memberGroup">
                    <option value="committee" data-i18n="admin_member_committee">Au comité</option>
                    <option value="all" data-i18n="admin_member_all">Tous les membres</option>
                </select>
            </div>
            <button onclick="addMember()" class="btn-green" style="margin-top: 10px;" data-i18n="admin_member_add_btn">➕ Ajouter le membre</button>
            <div id="memberList" style="margin-top: 20px;"></div>
        </div>
    </div>

        let currentLang = localStorage.getItem('vespacaution_lang') || 'fr';

        function t(key) {
            return (adminTranslations[currentLang] && adminTranslations[currentLang][key]) ? adminTranslations[currentLang][key] : key;
        }

        function applyTranslations() {
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (adminTranslations[currentLang] && adminTranslations[currentLang][key]) {
                    el.innerHTML = adminTranslations[currentLang][key];
                }
            });
            document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
                const key = el.getAttribute('data-i18n-placeholder');
                if (adminTranslations[currentLang] && adminTranslations[currentLang][key]) {
                    el.placeholder = adminTranslations[currentLang][key];
                }
            });
        }

        // ==========================================
        // 1. CONNEXION ADMIN
        // ==========================================
        const ENCODED_EMAIL = "Y29taXRlQHZlc3BhY2F1dGlvbi5jaA==";
        const ENCODED_PASSWORD = "VjM1cGFjYXV0MTBuMjY=";
        
        let transactions = [];
        let archives = {};
        let blogPosts = [];
        let members = [];
        let isLoggedIn = false;

        function login() {
            const email = document.getElementById('email').value;
            const pass = document.getElementById('password').value;
            if (email === atob(ENCODED_EMAIL) && pass === atob(ENCODED_PASSWORD)) {
                isLoggedIn = true;
                document.getElementById('authSection').classList.add('hidden');
                document.getElementById('appSection').classList.remove('hidden');
                loadAllData();
            } else {
                document.getElementById('authMsg').textContent = "❌ Identifiants incorrects.";
            }
        }

        function logout() {
            isLoggedIn = false;
            document.getElementById('appSection').classList.add('hidden');
            document.getElementById('authSection').classList.remove('hidden');
            document.getElementById('email').value = '';
            document.getElementById('password').value = '';
        }

        // ==========================================
        // 2. STOCKAGE LOCAL
        // ==========================================
        function loadAllData() {
            const savedCaisse = localStorage.getItem('vc_caisse');
            if (savedCaisse) transactions = JSON.parse(savedCaisse);
            const savedArchives = localStorage.getItem('vc_archives');
            if (savedArchives) archives = JSON.parse(savedArchives);
            const savedBlog = localStorage.getItem('vc_blog');
            if (savedBlog) blogPosts = JSON.parse(savedBlog);
            const savedMembers = localStorage.getItem('vc_members');
            if (savedMembers) members = JSON.parse(savedMembers);
            
            renderTable();
            renderArchives();
            renderBlog();
            renderMembers();
            updateEditorFolders();
        }

        function saveAllData() {
            localStorage.setItem('vc_caisse', JSON.stringify(transactions));
            localStorage.setItem('vc_archives', JSON.stringify(archives));
            localStorage.setItem('vc_blog', JSON.stringify(blogPosts));
            localStorage.setItem('vc_members', JSON.stringify(members));
        }

        // ==========================================
        // 3. ONGLETS
        // ==========================================
        function switchTab(tab) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelector(`.tab[onclick="switchTab('${tab}')"]`).classList.add('active');
            
            document.getElementById('tabCaisse').classList.add('hidden');
            document.getElementById('tabArchives').classList.add('hidden');
            document.getElementById('tabEditor').classList.add('hidden');
            document.getElementById('tabBlog').classList.add('hidden');

            if (tab === 'caisse') document.getElementById('tabCaisse').classList.remove('hidden');
            if (tab === 'archives') { document.getElementById('tabArchives').classList.remove('hidden'); renderArchives(); }
            if (tab === 'editor') { document.getElementById('tabEditor').classList.remove('hidden'); updateEditorFolders(); }
            if (tab === 'blog') { document.getElementById('tabBlog').classList.remove('hidden'); renderBlog(); renderMembers(); }
        }

        // ==========================================
        // 4. LOGIQUE CAISSE
        // ==========================================
        function renderTable() {
            const tbody = document.querySelector('#txTable tbody');
            tbody.innerHTML = '';
            transactions.forEach((tx, index) => {
                let montantAffiche = tx.amount;
                let couleur = 'green';
                if (tx.type === 'spend') { montantAffiche = -Math.abs(tx.amount); couleur = 'red'; }
                else { montantAffiche = Math.abs(tx.amount); }
                tbody.innerHTML += `<tr>
                    <td>${tx.date}</td><td>${tx.desc}</td>
                    <td style="color:${couleur}; font-weight:bold;">${montantAffiche.toFixed(2)} CHF</td>
                    <td><button class="btn-red btn-sm" onclick="deleteTransaction(${index})">🗑️</button></td>
                </tr>`;
            });
        }

        function addTransaction() {
            const type = document.getElementById('txType').value;
            const date = document.getElementById('txDate').value;
            const desc = document.getElementById('txDesc').value;
            const amount = parseFloat(document.getElementById('txAmount').value);
            if (!date || !desc || isNaN(amount)) return alert("Remplis tous les champs !");
            transactions.push({ type, date, desc, amount: Math.abs(amount) });
            renderTable(); saveAllData();
            document.getElementById('txDate').value = '';
            document.getElementById('txDesc').value = '';
            document.getElementById('txAmount').value = '';
        }

        function deleteTransaction(index) {
            if (confirm("Supprimer cette ligne ?")) {
                transactions.splice(index, 1);
                renderTable(); saveAllData();
            }
        }

        // ==========================================
        // 5. ARCHIVES
        // ==========================================
        function renderArchives() {
            const container = document.getElementById('foldersContainer');
            container.innerHTML = '';
            if (Object.keys(archives).length === 0) {
                container.innerHTML = '<p style="color:#888; font-style:italic;">Aucun dossier.</p>';
                return;
            }
            for (const folderName in archives) {
                let folderHtml = `<div style="border: 1px solid #ddd; padding: 15px; border-radius: 8px; margin-bottom: 15px; background: white;">
                    <div style="display:flex; justify-content:space-between; align-items:center;">
                        <h3 style="margin:0; color:#457b9d;">📁 ${folderName}</h3>
                        <button class="btn-red btn-sm" onclick="deleteFolder('${folderName}')">Supprimer</button>
                    </div><div style="margin-top:10px;">`;
                if (archives[folderName].length === 0) {
                    folderHtml += '<p style="font-size:12px; color:#aaa;">Dossier vide</p>';
                } else {
                    archives[folderName].forEach(doc => {
                        folderHtml += `<div style="border-bottom: 1px solid #eee; padding: 5px 0;">
                            <span>${doc.type === 'file' ? '📄' : '📝'} ${doc.name}</span>
                            <div style="float:right;">
                                ${doc.type === 'file' ? `<a href="${doc.content}" download="${doc.name}" class="btn-blue btn-sm" style="text-decoration:none; padding:2px 8px; color:white; border-radius:4px; font-size:12px;">Télécharger</a>` : `<button class="btn-blue btn-sm" onclick="viewTextDoc('${folderName}', '${doc.id}')">Lire</button>`}
                                <button class="btn-red btn-sm" onclick="deleteDoc('${folderName}', '${doc.id}')">🗑️</button>
                            </div>
                        </div>`;
                    });
                }
                folderHtml += `</div></div>`;
                container.innerHTML += folderHtml;
            }
        }

        function createFolder() {
            const name = document.getElementById('newFolderName').value.trim();
            if (!name) return alert("Entrez un nom.");
            if (archives[name]) return alert("Dossier existant.");
            archives[name] = [];
            document.getElementById('newFolderName').value = '';
            renderArchives(); saveAllData(); updateEditorFolders();
        }

        function deleteFolder(name) {
            if (confirm(`Supprimer le dossier "${name}" ?`)) {
                delete archives[name];
                renderArchives(); saveAllData(); updateEditorFolders();
            }
        }

        function uploadFile(event) {
            const file = event.target.files[0];
            if (!file) return;
            const folder = prompt("Nom du dossier (laisser vide pour 'Général')");
            const targetFolder = folder && folder.trim() !== '' ? folder.trim() : 'Général';
            if (!archives[targetFolder]) archives[targetFolder] = [];
            const reader = new FileReader();
            reader.onload = function(e) {
                archives[targetFolder].push({ id: Date.now().toString(), name: file.name, type: 'file', content: e.target.result });
                renderArchives(); saveAllData();
            };
            reader.readAsDataURL(file);
            event.target.value = '';
        }

        function deleteDoc(folder, id) {
            if (confirm("Supprimer ce document ?")) {
                archives[folder] = archives[folder].filter(doc => doc.id !== id);
                renderArchives(); saveAllData();
            }
        }

        function viewTextDoc(folder, id) {
            const doc = archives[folder].find(d => d.id === id);
            if (doc) alert("📄 " + doc.name + "\n\n" + doc.content);
        }

        // ==========================================
        // 6. ÉDITEUR DE TEXTE
        // ==========================================
        function updateEditorFolders() {
            const select = document.getElementById('editorFolder');
            select.innerHTML = `<option value="Général">${t('admin_general_folder')}</option>`;
            for (const folderName in archives) {
                if (folderName !== 'Général') {
                    select.innerHTML += `<option value="${folderName}">${folderName}</option>`;
                }
            }
        }

        function saveTextDoc() {
            const folder = document.getElementById('editorFolder').value;
            const title = document.getElementById('editorTitle').value.trim();
            const content = document.getElementById('editorContent').value.trim();
            if (!title || !content) return alert("Remplis le titre et le contenu.");
            if (!archives[folder]) archives[folder] = [];
            archives[folder].push({ id: Date.now().toString(), name: title + ".txt", type: 'text', content: content });
            saveAllData();
            alert("✅ Document enregistré !");
            document.getElementById('editorTitle').value = '';
            document.getElementById('editorContent').value = '';
        }

        // ==========================================
        // 7. BLOG & MEMBRES
        // ==========================================
        function addBlogPost() {
            const title = document.getElementById('blogTitle').value.trim();
            const content = document.getElementById('blogContent').value.trim();
            if (!title || !content) return alert("Remplis le titre et le contenu.");
            blogPosts.push({ id: Date.now().toString(), date: new Date().toISOString(), title, content });
            saveAllData();
            renderBlog();
            document.getElementById('blogTitle').value = '';
            document.getElementById('blogContent').value = '';
            alert("✅ Article publié ! (N'oublie pas de Sauvegarder sur GitHub)");
        }

        function renderBlog() {
            const container = document.getElementById('blogList');
            container.innerHTML = blogPosts.length === 0 ? '<p style="color:#888;">Aucun article.</p>' : '';
            blogPosts.forEach(post => {
                container.innerHTML += `<div style="border:1px solid #ddd; padding:10px; margin-bottom:10px; border-radius:6px; background:#fafafa;">
                    <strong>${post.title}</strong> <small>(${new Date(post.date).toLocaleDateString()})</small>
                    <p style="font-size:12px; color:#666;">${post.content.substring(0, 100)}...</p>
                    <button class="btn-red btn-sm" onclick="deleteBlog('${post.id}')">Supprimer</button>
                </div>`;
            });
        }

        function deleteBlog(id) {
            if (confirm("Supprimer cet article ?")) {
                blogPosts = blogPosts.filter(p => p.id !== id);
                saveAllData(); renderBlog();
            }
        }

        function addMember() {
            const name = document.getElementById('memberName').value.trim();
            const role = document.getElementById('memberRole').value.trim();
            const image = document.getElementById('memberImage').value.trim();
            const group = document.getElementById('memberGroup').value;
            if (!name || !role) return alert("Remplis le nom et le rôle.");
            members.push({ id: Date.now().toString(), name, role, image, group });
            saveAllData();
            renderMembers();
            document.getElementById('memberName').value = '';
            document.getElementById('memberRole').value = '';
            document.getElementById('memberImage').value = '';
            alert("✅ Membre ajouté ! (N'oublie pas de Sauvegarder sur GitHub)");
        }

        function renderMembers() {
            const container = document.getElementById('memberList');
            container.innerHTML = members.length === 0 ? '<p style="color:#888;">Aucun membre ajouté manuellement.</p>' : '';
            members.forEach(m => {
                container.innerHTML += `<div style="border:1px solid #ddd; padding:10px; margin-bottom:10px; border-radius:6px; background:#fafafa;">
                    <strong>${m.name}</strong> - ${m.role} <span style="font-size:10px; background:#e6e2d8; padding:2px 5px; border-radius:4px;">${m.group === 'committee' ? 'Comité' : 'Tous'}</span>
                    <button class="btn-red btn-sm" onclick="deleteMember('${m.id}')">Supprimer</button>
                </div>`;
            });
        }

        function deleteMember(id) {
            if (confirm("Supprimer ce membre ?")) {
                members = members.filter(m => m.id !== id);
                saveAllData(); renderMembers();
            }
        }

        // ==========================================
        // 8. EXPORT / IMPORT CSV & PDF
        // ==========================================
        function exportCSV() {
            let csv = "Type,Date,Description,Montant (CHF)\n";
            transactions.forEach(tx => { 
                const typeLabel = tx.type === 'spend' ? 'Dépense' : 'Reçu';
                const montant = tx.type === 'spend' ? -Math.abs(tx.amount) : Math.abs(tx.amount);
                csv += `"${typeLabel}","${tx.date}","${tx.desc}",${montant}\n`; 
            });
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = "Vespacaution_Caisse.csv";
            link.click();
        }

        function exportPDF() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            doc.setFontSize(22); doc.setTextColor(201, 155, 72);
            doc.text("Rapport Financier - Vespacaution", 20, 20);
            doc.setFontSize(12); doc.setTextColor(50, 50, 50);
            doc.text("Généré le : " + new Date().toLocaleDateString(), 20, 30);
            let totalReceived = 0, totalSpent = 0;
            const tableData = transactions.map(tx => {
                let montant = tx.amount;
                if (tx.type === 'spend') { montant = -Math.abs(tx.amount); totalSpent += Math.abs(tx.amount); }
                else { montant = Math.abs(tx.amount); totalReceived += Math.abs(tx.amount); }
                const typeLabel = tx.type === 'spend' ? 'Dépense' : 'Reçu';
                return [tx.date, tx.desc, typeLabel, montant.toFixed(2) + " CHF"];
            });
            doc.autoTable({ startY: 40, head: [['Date', 'Description', 'Type', 'Montant']], body: tableData, headStyles: { fillColor: [201, 155, 72] } });
            let finalY = doc.lastAutoTable.finalY + 10;
            doc.setFontSize(12);
            doc.setTextColor(92, 184, 92); doc.text(`Total Reçu : ${totalReceived.toFixed(2)} CHF`, 20, finalY);
            doc.setTextColor(217, 83, 79); doc.text(`Total Dépenses : ${totalSpent.toFixed(2)} CHF`, 20, finalY + 8);
            doc.setTextColor(50, 50, 50); doc.setFont(undefined, 'bold'); doc.text(`SOLDE TOTAL : ${(totalReceived - totalSpent).toFixed(2)} CHF`, 20, finalY + 18);
            doc.save("Vespacaution_Rapport.pdf");
        }

        // ==========================================
        // 9. SYNCHRONISATION GITHUB GIST
        // ==========================================
        const GITHUB_TOKEN = "%%TOKEN_SECRET%%"; 
        const GIST_ID = "f4fe8523136960f0289660123aa32cb7"; 
        const GIST_FILENAME = "vespacaution_data.json";
        const GITHUB_API_URL = "https://api.github.com/gists/" + GIST_ID;

        async function syncCloud(action) {
            const status = document.getElementById('syncStatus');
            const headers = { 'Authorization': 'token ' + GITHUB_TOKEN, 'Accept': 'application/vnd.github.v3+json' };

            if (action === 'save') {
                status.textContent = "Envoi en cours...";
                try {
                    const data = { caisse: transactions, archives: archives, blog: blogPosts, members: members };
                    const jsonString = JSON.stringify(data);
                    
                    const sizeInBytes = new Blob([jsonString]).size;
                    if (sizeInBytes > 1048576) { 
                        alert("⚠️ Attention : Tes données dépassent 1 Mo. Retire les gros fichiers PDF/Images des archives avant de sauvegarder.");
                        status.textContent = "❌ Trop lourd";
                        return;
                    }

                    const res = await fetch(GITHUB_API_URL, {
                        method: 'PATCH',
                        headers: { ...headers, 'Content-Type': 'application/json' },
                        body: JSON.stringify({ files: { [GIST_FILENAME]: { content: jsonString } } })
                    });
                    
                    if (res.ok) {
                        status.textContent = "✅ Sauvegardé";
                        alert("Sauvegarde GitHub réussie ! Le site public est mis à jour.");
                    } else {
                        status.textContent = "❌ Erreur";
                        alert("Erreur de sauvegarde.");
                    }
                } catch (e) { status.textContent = "❌ Erreur réseau"; }
            } 
            
            if (action === 'load') {
                status.textContent = "Chargement...";
                try {
                    const res = await fetch(GITHUB_API_URL, { headers });
                    const gistData = await res.json();
                    if (gistData.files && gistData.files[GIST_FILENAME]) {
                        const fileContent = gistData.files[GIST_FILENAME].content;
                        if (!fileContent || fileContent.trim() === "{}") return alert("Aucune donnée sur le Cloud.");
                        
                        let parsed;
                        try { parsed = JSON.parse(fileContent); } 
                        catch (e) { return alert("❌ Fichier corrompu."); }
                        
                        if (confirm("Charger les données depuis GitHub ? (Cela écrasera les données locales)")) {
                            transactions = parsed.caisse || [];
                            archives = parsed.archives || {};
                            blogPosts = parsed.blog || [];
                            members = parsed.members || [];
                            saveAllData();
                            renderTable(); renderArchives(); renderBlog(); renderMembers();
                            status.textContent = "✅ Chargé";
                        }
                    }
                } catch (e) { status.textContent = "❌ Erreur"; }
            }
        }

        // ==========================================
        // 10. INITIALISATION
        // ==========================================
        window.addEventListener('DOMContentLoaded', () => {
            applyTranslations();
        });
    </script>
</body>
