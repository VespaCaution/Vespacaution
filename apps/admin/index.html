<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comité — Vespacaution</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
    
    <style>
        body { font-family: sans-serif; background: #f9f7f1; color: #2d2d2d; padding: 20px; max-width: 900px; margin: auto; }
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); margin-bottom: 20px; border: 1px solid #e6e2d8; }
        h1, h2 { color: #c99b48; }
        input, button, select { padding: 10px; margin: 5px 0; border-radius: 6px; border: 1px solid #ddd; width: 100%; box-sizing: border-box; font-family: inherit; font-size: 14px; }
        button { background: #c99b48; color: white; font-weight: bold; cursor: pointer; border: none; transition: 0.2s; }
        button:hover { background: #b5883b; }
        .hidden { display: none !important; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; font-size: 14px; }
        th { background: #f4ebd9; }
        .flex { display: flex; gap: 10px; flex-wrap: wrap; }
        .flex > * { flex: 1; min-width: 120px; }
        .btn-red { background: #d9534f; }
        .btn-green { background: #5cb85c; }
        .btn-grey { background: #888; }
        .btn-blue { background: #457b9d; }
        .btn-sm { padding: 5px 10px; font-size: 12px; width: auto; margin: 0; }
        .tabs { display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 2px solid #e6e2d8; padding-bottom: 10px; }
        .tab { background: none; color: #6b6b6b; border: none; font-size: 1.1rem; cursor: pointer; padding: 5px 15px; border-radius: 8px; }
        .tab.active { background: #f4ebd9; color: #c99b48; font-weight: bold; }
        .doc-item { border: 1px solid #eee; padding: 10px; margin-bottom: 10px; border-radius: 6px; display: flex; justify-content: space-between; align-items: center; background: #fafafa; }
    </style>
</head>
<body>

    <div id="authSection" class="card" style="text-align: center;">
        <h1>🔒 Espace Comité</h1>
        <input type="email" id="email" placeholder="Email (comite@vespacaution.ch)">
        <input type="password" id="password" placeholder="Mot de passe">
        <button onclick="login()" style="margin-top: 15px;">Se connecter</button>
        <p id="authMsg" style="color: red; font-weight: bold;"></p>
    </div>

    <div id="appSection" class="hidden">
        <div class="card" style="display:flex; justify-content:space-between; align-items:center; flex-wrap: wrap; gap: 10px;">
            <h1 style="margin:0;">Tableau de bord</h1>
            <div style="display: flex; gap: 10px; align-items: center;">
                <button onclick="downloadBackup()" class="btn-blue btn-sm">💾 Sauvegarder (Fichier)</button>
                <input type="file" id="uploadBackup" accept=".json" style="display:none;" onchange="uploadBackup(event)">
                <button onclick="document.getElementById('uploadBackup').click()" class="btn-green btn-sm">📂 Charger (Fichier)</button>
                <button onclick="logout()" class="btn-red btn-sm" style="width:auto; padding: 10px;">Déconnexion</button>
            </div>
        </div>

        <div class="tabs">
            <button class="tab active" onclick="switchTab('caisse')">💰 Caisse</button>
            <button class="tab" onclick="switchTab('archives')">📁 Archives</button>
        </div>

        <div id="tabCaisse" class="card">
            <h2>💰 Journal de Caisse</h2>
            <div class="flex">
                <select id="txType" style="flex: 0.8;">
                    <option value="receive">🟢 Reçu</option>
                    <option value="spend">🔴 Dépense</option>
                </select>
                <input type="date" id="txDate" style="flex: 1;">
                <input type="text" id="txDesc" placeholder="Description" style="flex: 2;">
                <input type="number" id="txAmount" placeholder="Montant" style="flex: 1;">
                <button onclick="addTransaction()" style="width: 100px;">Ajouter</button>
            </div>
            
            <table id="txTable">
                <thead><tr><th>Date</th><th>Description</th><th>Montant</th><th>Action</th></tr></thead>
                <tbody></tbody>
            </table>

            <div class="flex" style="margin-top: 20px;">
                <button onclick="exportCSV()" class="btn-green">📥 Export Excel (CSV)</button>
                <button onclick="exportPDF()" class="btn-red">📄 Export PDF</button>
                <input type="file" id="importCSV" accept=".csv" style="display:none;" onchange="importCSV(event)">
                <button onclick="document.getElementById('importCSV').click()" class="btn-grey">📤 Import CSV</button>
            </div>
        </div>

        <div id="tabArchives" class="card hidden">
            <h2>📁 Archives</h2>
            <div class="flex" style="margin-bottom: 20px;">
                <input type="text" id="newFolderName" placeholder="Nom du dossier">
                <button onclick="createFolder()" style="width: 150px;">Créer</button>
            </div>
            <div class="flex" style="margin-bottom: 20px;">
                <input type="file" id="fileUpload" accept=".pdf,.doc,.docx,.txt" style="display:none;" onchange="uploadFile(event)">
                <button onclick="document.getElementById('fileUpload').click()" class="btn-blue">📤 Importer</button>
                <button onclick="createTextDoc()" class="btn-green">📝 Créer doc</button>
            </div>
            <div id="foldersContainer"></div>
        </div>
    </div>

    <script>
        // ==========================================
        // 1. CONNEXION ADMIN
        // ==========================================
        // Email : comite@vespacaution.ch | Mot de passe : V35pacaut10n26
        const ENCODED_EMAIL = "Y29taXRlQHZlc3BhY2F1dGlvbi5jaA==";
        const ENCODED_PASSWORD = "VjM1cGFjYXV0MTBuMjY=";

        let transactions = [];
        let archives = {};
        let isLoggedIn = false;

        function login() {
            const email = document.getElementById('email').value;
            const pass = document.getElementById('password').value;
            if (email === atob(ENCODED_EMAIL) && pass === atob(ENCODED_PASSWORD)) {
                isLoggedIn = true;
                document.getElementById('authSection').classList.add('hidden');
                document.getElementById('appSection').classList.remove('hidden');
                loadAllData();
            } else {
                document.getElementById('authMsg').textContent = "❌ Identifiants incorrects.";
            }
        }

        function logout() {
            isLoggedIn = false;
            document.getElementById('appSection').classList.add('hidden');
            document.getElementById('authSection').classList.remove('hidden');
            document.getElementById('email').value = '';
            document.getElementById('password').value = '';
            transactions = [];
            archives = {};
        }

        // ==========================================
        // 2. STOCKAGE LOCAL
        // ==========================================
        function loadAllData() {
            const savedCaisse = localStorage.getItem('vc_caisse');
            if (savedCaisse) transactions = JSON.parse(savedCaisse);
            const savedArchives = localStorage.getItem('vc_archives');
            if (savedArchives) archives = JSON.parse(savedArchives);
            renderTable();
            renderArchives();
        }

        function saveAllData() {
            localStorage.setItem('vc_caisse', JSON.stringify(transactions));
            localStorage.setItem('vc_archives', JSON.stringify(archives));
        }

        // ==========================================
        // 3. LOGIQUE CAISSE
        // ==========================================
        function switchTab(tab) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelector(`.tab[onclick="switchTab('${tab}')"]`).classList.add('active');
            if (tab === 'caisse') {
                document.getElementById('tabCaisse').classList.remove('hidden');
                document.getElementById('tabArchives').classList.add('hidden');
            } else {
                document.getElementById('tabCaisse').classList.add('hidden');
                document.getElementById('tabArchives').classList.remove('hidden');
            }
        }

        function renderTable() {
            const tbody = document.querySelector('#txTable tbody');
            tbody.innerHTML = '';
            transactions.forEach((tx, index) => {
                let montantAffiche = tx.amount;
                let couleur = 'green';
                if (tx.type === 'spend') {
                    montantAffiche = -Math.abs(tx.amount);
                    couleur = 'red';
                } else {
                    montantAffiche = Math.abs(tx.amount);
                }
                tbody.innerHTML += `<tr>
                    <td>${tx.date}</td>
                    <td>${tx.desc}</td>
                    <td style="color:${couleur}; font-weight:bold;">${montantAffiche.toFixed(2)} CHF</td>
                    <td><button class="btn-red btn-sm" onclick="deleteTransaction(${index})">🗑️</button></td>
                </tr>`;
            });
        }

        function addTransaction() {
            const type = document.getElementById('txType').value;
            const date = document.getElementById('txDate').value;
            const desc = document.getElementById('txDesc').value;
            const amount = parseFloat(document.getElementById('txAmount').value);
            if (!date || !desc || isNaN(amount)) return alert("Remplis tous les champs !");
            transactions.push({ type, date, desc, amount: Math.abs(amount) });
            renderTable(); saveAllData();
            document.getElementById('txDate').value = '';
            document.getElementById('txDesc').value = '';
            document.getElementById('txAmount').value = '';
        }

        function deleteTransaction(index) {
            if (confirm("Supprimer cette ligne ?")) {
                transactions.splice(index, 1);
                renderTable(); saveAllData();
            }
        }

        // ==========================================
        // 4. LOGIQUE ARCHIVES
        // ==========================================
        function renderArchives() {
            const container = document.getElementById('foldersContainer');
            container.innerHTML = '';
            if (Object.keys(archives).length === 0) {
                container.innerHTML = '<p style="color:#888; font-style:italic;">Aucun dossier.</p>';
                return;
            }
            for (const folderName in archives) {
                let folderHtml = `<div style="border: 1px solid #ddd; padding: 15px; border-radius: 8px; margin-bottom: 15px; background: white;">
                    <div style="display:flex; justify-content:space-between; align-items:center;">
                        <h3 style="margin:0; color:#457b9d;">📁 ${folderName}</h3>
                        <button class="btn-red btn-sm" onclick="deleteFolder('${folderName}')">Supprimer</button>
                    </div><div style="margin-top:10px;">`;
                if (archives[folderName].length === 0) {
                    folderHtml += '<p style="font-size:12px; color:#aaa;">Dossier vide</p>';
                } else {
                    archives[folderName].forEach(doc => {
                        folderHtml += `<div class="doc-item">
                            <span>${doc.type === 'file' ? '📄' : '📝'} ${doc.name}</span>
                            <div>
                                ${doc.type === 'file' ? `<a href="${doc.content}" download="${doc.name}" class="btn-blue btn-sm" style="text-decoration:none; padding:5px 10px; color:white; border-radius:4px; font-size:12px;">Télécharger</a>` : `<button class="btn-blue btn-sm" onclick="viewTextDoc('${folderName}', '${doc.id}')">Lire</button>`}
                                <button class="btn-red btn-sm" onclick="deleteDoc('${folderName}', '${doc.id}')">🗑️</button>
                            </div>
                        </div>`;
                    });
                }
                folderHtml += `</div></div>`;
                container.innerHTML += folderHtml;
            }
        }

        function createFolder() {
            const name = document.getElementById('newFolderName').value.trim();
            if (!name) return alert("Entrez un nom.");
            if (archives[name]) return alert("Dossier existant.");
            archives[name] = [];
            document.getElementById('newFolderName').value = '';
            renderArchives(); saveAllData();
        }

        function deleteFolder(name) {
            if (confirm(`Supprimer le dossier "${name}" ?`)) {
                delete archives[name];
                renderArchives(); saveAllData();
            }
        }

        function uploadFile(event) {
            const file = event.target.files[0];
            if (!file) return;
            const folder = prompt("Nom du dossier (laisser vide pour 'Général')");
            const targetFolder = folder && folder.trim() !== '' ? folder.trim() : 'Général';
            if (!archives[targetFolder]) archives[targetFolder] = [];
            const reader = new FileReader();
            reader.onload = function(e) {
                archives[targetFolder].push({ id: Date.now().toString(), name: file.name, type: 'file', content: e.target.result });
                renderArchives(); saveAllData();
            };
            reader.readAsDataURL(file);
            event.target.value = '';
        }

        function createTextDoc() {
            const folder = prompt("Nom du dossier (laisser vide pour 'Général')");
            const targetFolder = folder && folder.trim() !== '' ? folder.trim() : 'Général';
            const name = prompt("Nom du document");
            if (!name) return;
            const content = prompt("Contenu :");
            if (content === null) return;
            if (!archives[targetFolder]) archives[targetFolder] = [];
            archives[targetFolder].push({ id: Date.now().toString(), name: name + ".txt", type: 'text', content: content });
            renderArchives(); saveAllData();
        }

        function deleteDoc(folder, id) {
            if (confirm("Supprimer ce document ?")) {
                archives[folder] = archives[folder].filter(doc => doc.id !== id);
                renderArchives(); saveAllData();
            }
        }

        function viewTextDoc(folder, id) {
            const doc = archives[folder].find(d => d.id === id);
            if (doc) alert("📄 " + doc.name + "\n\n" + doc.content);
        }

        // ==========================================
        // 5. EXPORT / IMPORT (CSV, PDF)
        // ==========================================
        function exportCSV() {
            let csv = "Type,Date,Description,Montant (CHF)\n";
            transactions.forEach(tx => { 
                const typeLabel = tx.type === 'spend' ? 'Dépense' : 'Reçu';
                const montant = tx.type === 'spend' ? -Math.abs(tx.amount) : Math.abs(tx.amount);
                csv += `"${typeLabel}","${tx.date}","${tx.desc}",${montant}\n`; 
            });
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = "Vespacaution_Caisse.csv";
            link.click();
        }

        function importCSV(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                const lines = e.target.result.split('\n');
                for (let i = 1; i < lines.length; i++) {
                    const [typeStr, date, desc, amountStr] = lines[i].split(',');
                    if (date && desc && amountStr) {
                        const type = typeStr.replace(/"/g, '').toLowerCase().includes('dépense') ? 'spend' : 'receive';
                        transactions.push({ type, date: date.replace(/"/g, ''), desc: desc.replace(/"/g, ''), amount: Math.abs(parseFloat(amountStr)) });
                    }
                }
                renderTable(); saveAllData();
            };
            reader.readAsText(file);
        }

        function exportPDF() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            doc.setFontSize(22); doc.setTextColor(201, 155, 72);
            doc.text("Rapport Financier - Vespacaution", 20, 20);
            doc.setFontSize(12); doc.setTextColor(50, 50, 50);
            doc.text("Généré le : " + new Date().toLocaleDateString(), 20, 30);
            let totalReceived = 0, totalSpent = 0;
            const tableData = transactions.map(tx => {
                let montant = tx.amount;
                if (tx.type === 'spend') { montant = -Math.abs(tx.amount); totalSpent += Math.abs(tx.amount); }
                else { montant = Math.abs(tx.amount); totalReceived += Math.abs(tx.amount); }
                const typeLabel = tx.type === 'spend' ? 'Dépense' : 'Reçu';
                return [tx.date, tx.desc, typeLabel, montant.toFixed(2) + " CHF"];
            });
            doc.autoTable({ startY: 40, head: [['Date', 'Description', 'Type', 'Montant']], body: tableData, headStyles: { fillColor: [201, 155, 72] } });
            let finalY = doc.lastAutoTable.finalY + 10;
            doc.setFontSize(12);
            doc.setTextColor(92, 184, 92); doc.text(`Total Reçu : ${totalReceived.toFixed(2)} CHF`, 20, finalY);
            doc.setTextColor(217, 83, 79); doc.text(`Total Dépenses : ${totalSpent.toFixed(2)} CHF`, 20, finalY + 8);
            doc.setTextColor(50, 50, 50); doc.setFont(undefined, 'bold'); doc.text(`SOLDE TOTAL : ${(totalReceived - totalSpent).toFixed(2)} CHF`, 20, finalY + 18);
            doc.save("Vespacaution_Rapport.pdf");
        }

        // ==========================================
        // 6. SAUVEGARDE / CHARGEMENT (FICHIER JSON)
        // ==========================================
        function downloadBackup() {
            const data = {
                date: new Date().toISOString(),
                caisse: transactions,
                archives: archives
            };
            const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = `Vespacaution_Backup_${new Date().toISOString().split('T')[0]}.json`;
            link.click();
        }

        function uploadBackup(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const parsed = JSON.parse(e.target.result);
                    if (parsed.caisse || parsed.archives) {
                        if (confirm("⚠️ Attention : Cela va remplacer TOUTES les données actuelles. Continuer ?")) {
                            transactions = parsed.caisse || [];
                            archives = parsed.archives || {};
                            renderTable();
                            renderArchives();
                            saveAllData();
                            alert("✅ Sauvegarde restaurée avec succès !");
                        }
                    } else {
                        alert("❌ Fichier JSON invalide.");
                    }
                } catch (err) {
                    alert("❌ Erreur lors de la lecture du fichier.");
                }
            };
            reader.readAsText(file);
            event.target.value = '';
        }
    </script>
</body>
</html>
