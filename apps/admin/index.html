    <style>
        body { font-family: sans-serif; background: #f9f7f1; color: #2d2d2d; padding: 20px; max-width: 900px; margin: auto; }
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); margin-bottom: 20px; border: 1px solid #e6e2d8; }
        h1, h2 { color: #c99b48; margin-top: 0; }
        input, button, textarea, select { padding: 10px; margin: 5px 0; border-radius: 6px; border: 1px solid #ddd; width: 100%; box-sizing: border-box; font-family: inherit; font-size: 14px; }
        button { background: #c99b48; color: white; font-weight: bold; cursor: pointer; border: none; transition: 0.2s; }
        button:hover { background: #b5883b; }
        .hidden { display: none !important; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; font-size: 14px; }
        th { background: #f4ebd9; }
        .flex { display: flex; gap: 10px; flex-wrap: wrap; }
        .flex > * { flex: 1; min-width: 120px; }
        .btn-red { background: #d9534f; }
        .btn-green { background: #5cb85c; }
        .btn-grey { background: #888; }
        .btn-blue { background: #457b9d; }
        .btn-sm { padding: 5px 10px; font-size: 12px; width: auto; margin: 0; }
        .tabs { display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 2px solid #e6e2d8; padding-bottom: 10px; }
        .tab { background: none; color: #6b6b6b; border: none; font-size: 1.1rem; cursor: pointer; padding: 5px 15px; border-radius: 8px; }
        .tab.active { background: #f4ebd9; color: #c99b48; font-weight: bold; }
        .doc-item { border: 1px solid #eee; padding: 10px; margin-bottom: 10px; border-radius: 6px; display: flex; justify-content: space-between; align-items: center; background: #fafafa; }
        
        /* Langue */
        .lang-container { display: flex; justify-content: flex-end; gap: 5px; margin-bottom: 10px; }
        .lang-btn { background: transparent; border: 1px solid #c99b48; color: #c99b48; padding: 2px 8px; border-radius: 4px; cursor: pointer; font-size: 12px; width: auto; }
        .lang-btn.active { background: #c99b48; color: white; }

        /* ÉDITEUR DE TEXTE PLEIN ÉCRAN */
        #editorOverlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); z-index: 9999;
            display: flex; justify-content: center; align-items: center; flex-direction: column;
        }
        .editor-box {
            background: white; width: 90%; max-width: 800px; height: 80vh;
            border-radius: 12px; display: flex; flex-direction: column; overflow: hidden;
        }
        .editor-header { background: #f4ebd9; padding: 15px; display: flex; justify-content: space-between; align-items: center; }
        .editor-content { flex: 1; display: flex; padding: 20px; gap: 10px; }
        .editor-content textarea { flex: 1; height: 100%; resize: none; border: none; border: 1px solid #ddd; padding: 15px; font-size: 16px; line-height: 1.5; }
        .editor-footer { padding: 15px; background: #f4ebd9; display: flex; gap: 10px; justify-content: flex-end; }
    </style>
</head>

            </div>
            </div>

        let currentLang = localStorage.getItem('vc_admin_lang') || 'fr';

        function setLanguage(lang) {
            currentLang = lang;
            localStorage.setItem('vc_admin_lang', lang);
            
            // Mise à jour des boutons de langue
            document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.remove('active'));
            const activeBtn = document.querySelector(`.lang-btn[onclick="setLanguage('${lang}')"]`);
            if(activeBtn) activeBtn.classList.add('active');

            // Traduction des textes
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (translations[lang] && translations[lang][key]) {
                    el.textContent = translations[lang][key];
                }
            });
            // Traduction des placeholders
            document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
                const key = el.getAttribute('data-i18n-placeholder');
                if (translations[lang] && translations[lang][key]) {
                    el.placeholder = translations[lang][key];
                }
            });
            renderArchives(); // Pour retraduire les boutons dynamiques
        }

        function t(key) {
            return translations[currentLang] && translations[currentLang][key] ? translations[currentLang][key] : key;
        }

        const ENCODED_EMAIL = "Y29taXRlQHZlc3BhY2F1dGlvbi5jaA==";
        const ENCODED_PASSWORD = "VjM1cGFjYXV0MTBuMjY=";

        let transactions = [];
        let archives = {};
        let isLoggedIn = false;

        function login() {
            const email = document.getElementById('email').value;
            const pass = document.getElementById('password').value;
            const msg = document.getElementById('authMsg');

            if (email === atob(ENCODED_EMAIL) && pass === atob(ENCODED_PASSWORD)) {
                isLoggedIn = true;
                document.getElementById('authSection').classList.add('hidden');
                document.getElementById('appSection').classList.remove('hidden');
                msg.textContent = "";
                loadAllData();
            } else {
                msg.textContent = "❌ " + (currentLang === 'fr' ? "Identifiants incorrects." : "Invalid credentials.");
            }
        }

        function logout() {
            isLoggedIn = false;
            document.getElementById('appSection').classList.add('hidden');
            document.getElementById('authSection').classList.remove('hidden');
            document.getElementById('email').value = '';
            document.getElementById('password').value = '';
            transactions = [];
            archives = {};
        }

                document.getElementById('tabCaisse').classList.remove('hidden');
                document.getElementById('tabArchives').classList.add('hidden');
            } else {
                document.getElementById('tabBtnArchives').classList.add('active');
                document.getElementById('tabCaisse').classList.add('hidden');
                document.getElementById('tabArchives').classList.remove('hidden');
            }
        }

        function loadAllData() {
            const savedCaisse = localStorage.getItem('vc_caisse');
            if (savedCaisse) transactions = JSON.parse(savedCaisse);
            const savedArchives = localStorage.getItem('vc_archives');
            if (savedArchives) archives = JSON.parse(savedArchives);
            renderTable();
            renderArchives();
        }

        function saveAllData() {
            localStorage.setItem('vc_caisse', JSON.stringify(transactions));
            localStorage.setItem('vc_archives', JSON.stringify(archives));
        }

        // ==========================================
        // 4. CAISSE
        // ==========================================
        function renderTable() {
            const tbody = document.querySelector('#txTable tbody');
            tbody.innerHTML = '';
            transactions.forEach((tx, index) => {
                tbody.innerHTML += `<tr>
                    <td>${tx.date}</td>
                    <td>${tx.desc}</td>
                    <td style="color:${tx.amount < 0 ? 'red' : 'green'}">${tx.amount} CHF</td>
                    <td><button class="btn-red btn-sm" onclick="deleteTransaction(${index})">🗑️</button></td>
                </tr>`;
            });
        }

        function addTransaction() {
            const date = document.getElementById('txDate').value;
            const desc = document.getElementById('txDesc').value;
            const amount = parseFloat(document.getElementById('txAmount').value);
            if (!date || !desc || isNaN(amount)) return alert(t('alert_fill_fields'));
            transactions.push({ date, desc, amount });
            renderTable(); saveAllData();
            document.getElementById('txDate').value = '';
            document.getElementById('txDesc').value = '';
            document.getElementById('txAmount').value = '';
        }

        function deleteTransaction(index) {
            if (confirm(t('alert_delete_line'))) {
                transactions.splice(index, 1);
                renderTable(); saveAllData();
            }
        }

        // ==========================================
        // 5. ARCHIVES
        // ==========================================
        function renderArchives() {
            const container = document.getElementById('foldersContainer');
            container.innerHTML = '';

            if (Object.keys(archives).length === 0) {
                container.innerHTML = `<p style="color:#888; font-style:italic;">${t('no_folders')}</p>`;
                return;
            }

            for (const folderName in archives) {
                let folderHtml = `
                <div style="border: 1px solid #ddd; padding: 15px; border-radius: 8px; margin-bottom: 15px; background: white;">
                    <div style="display:flex; justify-content:space-between; align-items:center;">
                        <h3 style="margin:0; color:#457b9d;">📁 ${folderName}</h3>
                        <button class="btn-red btn-sm" onclick="deleteFolder('${folderName}')">${t('btn_delete_folder')}</button>
                    </div>
                    <div style="margin-top:10px;">
                `;

                if (archives[folderName].length === 0) {
                    folderHtml += `<p style="font-size:12px; color:#aaa;">${t('empty_folder')}</p>`;
                } else {
                    archives[folderName].forEach(doc => {
                        folderHtml += `
                        <div class="doc-item">
                            <span>${doc.type === 'file' ? '📄' : '📝'} ${doc.name}</span>
                            <div>
                                ${doc.type === 'file' 
                                    ? `<a href="${doc.content}" download="${doc.name}" class="btn-blue btn-sm" style="text-decoration:none; padding:5px 10px; color:white; border-radius:4px; font-size:12px;">${t('btn_download')}</a>` 
                                    : `<button class="btn-blue btn-sm" onclick="openEditor('${folderName}', '${doc.id}')">${t('btn_open_editor')}</button>`}
                                <button class="btn-red btn-sm" onclick="deleteDoc('${folderName}', '${doc.id}')">🗑️</button>
                            </div>
                        </div>`;
                    });
                }
                folderHtml += `</div></div>`;
                container.innerHTML += folderHtml;
            }
        }

        function createFolder() {
            const name = document.getElementById('newFolderName').value.trim();
            if (!name) return alert(t('alert_enter_name'));
            if (archives[name]) return alert(t('alert_folder_exists'));
            archives[name] = [];
            document.getElementById('newFolderName').value = '';
            renderArchives(); saveAllData();
        }

        function deleteFolder(name) {
            if (confirm(t('alert_delete_folder'))) {
                delete archives[name];
                renderArchives(); saveAllData();
            }
        }

        function uploadFile(event) {
            const file = event.target.files[0];
            if (!file) return;
            const folder = prompt(t('prompt_folder'));
            const targetFolder = folder && folder.trim() !== '' ? folder.trim() : 'General';
            if (!archives[targetFolder]) archives[targetFolder] = [];
            const reader = new FileReader();
            reader.onload = function(e) {
                archives[targetFolder].push({
                    id: Date.now().toString(),
                    name: file.name,
                    type: 'file',
                    content: e.target.result
                });
                renderArchives(); saveAllData();
            };
            reader.readAsDataURL(file);
            event.target.value = ''; 
        }

        function deleteDoc(folder, id) {
            if (confirm(t('alert_delete_doc'))) {
                archives[folder] = archives[folder].filter(doc => doc.id !== id);
                renderArchives(); saveAllData();
            }
        }

        // --- ÉDITEUR ---
        let editingDocId = null;
        let currentFolder = null;

        function openEditor(folderName, docId = null) {
            if (folderName === 'new') {
                currentFolder = prompt(t('prompt_editor_folder')) || 'General';
            } else {
                currentFolder = folderName;
            }
            if (!archives[currentFolder]) archives[currentFolder] = [];

            document.getElementById('editorOverlay').classList.remove('hidden');
            
            if (docId && docId !== 'new') {
                const doc = archives[currentFolder].find(d => d.id === docId);
                if (doc) {
                    document.getElementById('editorTitle').value = doc.name.replace('.txt', '');
                    document.getElementById('editorText').value = doc.content;
                    editingDocId = docId;
                }
            } else {
                document.getElementById('editorTitle').value = "";
                document.getElementById('editorText').value = "";
                editingDocId = null;
            }
        }

        function closeEditor() {
            document.getElementById('editorOverlay').classList.add('hidden');
        }

        function saveTextDoc() {
            const title = document.getElementById('editorTitle').value.trim();
            const content = document.getElementById('editorText').value;
            if (!title) return alert(t('prompt_doc_title'));

            if (editingDocId) {
                const doc = archives[currentFolder].find(d => d.id === editingDocId);
                if (doc) { doc.name = title + ".txt"; doc.content = content; }
            } else {
                archives[currentFolder].push({ id: Date.now().toString(), name: title + ".txt", type: 'text', content: content });
            }
            renderArchives(); saveAllData();
            alert(t('alert_saved_archive') + " " + currentFolder);
            closeEditor();
        }

        function exportTXT() {
            const title = document.getElementById('editorTitle').value.trim() || "document";
            const content = document.getElementById('editorText').value;
            const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = title + ".txt";
            link.click();
        }

        function exportDOCX() {
            const title = document.getElementById('editorTitle').value.trim() || "document";
            const content = document.getElementById('editorText').value;
            const { Document, Packer, Paragraph, TextRun } = docx;
            const paragraphs = content.split('\n').map(line => new Paragraph({ children: [new TextRun(line)] }));
            const doc = new Document({
                sections: [{
                    properties: {},
                    children: [
                        new Paragraph({ children: [new TextRun({ text: title, bold: true, size: 32 })] }),
                        ...paragraphs
                    ],
                }],
            });
            Packer.toBlob(doc).then(blob => {
                const link = document.createElement("a");
                link.href = URL.createObjectURL(blob);
                link.download = title + ".docx";
                link.click();
            });
        }

        function exportEditorPDF() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            const title = document.getElementById('editorTitle').value.trim() || "document";
            const content = document.getElementById('editorText').value;
            doc.setFontSize(22); doc.setTextColor(50, 50, 50);
            doc.text(title, 20, 20);
            doc.setFontSize(12);
            const splitText = doc.splitTextToSize(content, 170); 
            doc.text(splitText, 20, 35);
            doc.save(title + ".pdf");
        }

        // ==========================================
        // 6. EXPORTS GLOBAUX
        // ==========================================
        function exportCSV() {
            let csv = "Date,Description,Amount\n";
            transactions.forEach(tx => { csv += `"${tx.date}","${tx.desc}",${tx.amount}\n`; });
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = "Vespacaution_Caisse.csv";
            link.click();
        }

        function importCSV(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                const lines = e.target.result.split('\n');
                for (let i = 1; i < lines.length; i++) {
                    const [date, desc, amount] = lines[i].split(',');
                    if (date && desc && amount) {
                        transactions.push({ date: date.replace(/"/g, ''), desc: desc.replace(/"/g, ''), amount: parseFloat(amount) });
                    }
                }
                renderTable(); saveAllData();
            };
            reader.readAsText(file);
        }

        function exportPDF() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            doc.setFontSize(22); doc.setTextColor(201, 155, 72);
            doc.text("Rapport Financier - Vespacaution", 20, 20);
            doc.setFontSize(12); doc.setTextColor(50, 50, 50);
            doc.text("Généré le : " + new Date().toLocaleDateString(), 20, 30);
            const tableData = transactions.map(tx => [tx.date, tx.desc, tx.amount + " CHF"]);
            const total = transactions.reduce((sum, tx) => sum + tx.amount, 0);
            doc.autoTable({
                startY: 40,
                head: [['Date', 'Description', 'Amount']],
                body: tableData,
                foot: [['', 'TOTAL', total + " CHF"]],
                headStyles: { fillColor: [201, 155, 72] }
            });
            doc.save("Vespacaution_Rapport.pdf");
        }

        function exportJSON() {
            const dataToSave = {
                app: "Vespacaution",
                version: "3.0",
                date: new Date().toISOString(),
                caisse: transactions,
                archives: archives 
            };
            const jsonString = JSON.stringify(dataToSave, null, 2);
            const blob = new Blob([jsonString], { type: 'application/json' });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = `Vespacaution_SAUVEGARDE_TOTALE_${new Date().toISOString().split('T')[0]}.json`;
            link.click();
        }

// ==========================================
// 7. EFFACER TOUTES LES DONNÉES
// ==========================================
function clearAllData() {
    const msg = currentLang === 'fr' ? "⚠️ Attention : Cela va supprimer TOUTES tes données (Caisse + Archives). Es-tu sûr ?" : "⚠️ Warning: This will delete ALL your data (Cash + Archives). Are you sure?";
    
    if (confirm(msg)) {
        // On vide la mémoire
        transactions = [];
        archives = {};
        
        // On vide le stockage local
        localStorage.removeItem('vc_caisse');
        localStorage.removeItem('vc_archives');
        
        // On met à jour l'écran
        renderTable();
        renderArchives();
        
        alert(currentLang === 'fr' ? "✅ Toutes les données ont été effacées." : "✅ All data has been cleared.");
    }
}
        
        function importJSON(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const parsed = JSON.parse(e.target.result);
                    if (parsed.caisse || parsed.archives) {
                        if(confirm(t('alert_confirm_replace'))) {
                            if (parsed.caisse) transactions = parsed.caisse;
                            if (parsed.archives) archives = parsed.archives;
                            renderTable(); renderArchives(); saveAllData();
                            alert(t('alert_json_restore'));
                        }
                    } else {
                        alert(t('alert_json_invalid'));
                    }
                } catch (err) {
                    alert(t('alert_json_invalid'));
                }
            };
            reader.readAsText(file);
            event.target.value = '';
        }

        // Initialisation de la langue au chargement
        setLanguage(currentLang);
    </script>
