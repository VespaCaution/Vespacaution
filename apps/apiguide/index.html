<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="color-scheme" content="light dark">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#c99b48">
<title>ApiGuide v1.0</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ApiGuide">
<style>
html, body { overscroll-behavior-y: contain; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
    font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    background: #f9f7f1;
    color: #2d2d2d;
    line-height: 1.5;
    padding: 0.75rem;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
}
/* =========================================
   DARK MODE - APIGUIDE
   ========================================= */
@media (prefers-color-scheme: dark) {
    :root { color-scheme: dark; }

    body { 
        background: #121212 !important; 
        color: #f0f0f0 !important; 
    }

    .app-header { 
        border-bottom-color: #333 !important; 
    }
    
    .app-title { 
        color: #c99b48 !important; 
    }
    
    .app-title small { 
        color: #a0a0a0 !important; 
    }

    .lang-select { 
        background: #2a2a2a !important; 
        color: #c99b48 !important; 
        border-color: #444 !important; 
    }

    .back-btn, .btn { 
        background: #c99b48 !important; 
        color: #121212 !important; 
    }
    
    .btn-ghost { 
        background: transparent !important; 
        border-color: #c99b48 !important; 
        color: #c99b48 !important; 
    }

    .grid-btn { 
        background: #1e1e1e !important; 
        color: #f0f0f0 !important; 
        border-color: #444 !important; 
        box-shadow: 0 3px 0 #c99b48 !important; 
    }

    .textbox-container { 
        background: #1e1e1e !important; 
        border-color: #333 !important; 
        box-shadow: 0 8px 20px rgba(0,0,0,0.5) !important; 
    }
    
    .textbox-container h2 { 
        color: #c99b48 !important; 
    }
    
    .text-content { 
        color: #f0f0f0 !important; 
    }
    
    .breadcrumb { 
        color: #c99b48 !important; 
    }

    textarea { 
        background: #121212 !important; 
        color: #f0f0f0 !important; 
        border-color: #444 !important; 
    }
    
    .empty-note { 
        color: #a0a0a0 !important; 
    }

    footer { 
        color: #a0a0a0 !important; 
        border-top-color: #333 !important; 
    }

    .install-btn { 
        background: #4a7c2e !important; 
        color: #ffffff !important; 
    }
    
    .editor-hint { 
        background: #3d3326 !important; 
        color: #c99b48 !important; 
        border-left-color: #c99b48 !important; 
    }
    
    .hidden-flag { opacity: 0.4; }

    #iosModal > div { 
        background: #1e1e1e !important; 
        border-color: #444 !important; 
    }
    
    #iosModal h2, #iosModal p, #iosModal li { 
        color: #f0f0f0 !important; 
    }
}
    .app-header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    padding: 0.25rem 0.5rem 0.75rem 0.5rem;
    border-bottom: 2px solid #c99b48;
    margin-bottom: 1rem;
    flex-wrap: wrap;
    gap: 0.5rem;
}
.app-title { font-size: 1.8rem; font-weight: 700; color: #c99b48; letter-spacing: -0.5px; }
.app-title small { font-size: 0.85rem; font-weight: 400; color: #6b6b6b; margin-left: 0.5rem; }
.lang-select {
    background: #fdfaf3;
    border: 1px solid #c99b48;
    padding: 0.4rem 0.6rem;
    border-radius: 30px;
    font-size: 0.85rem;
    font-weight: 600;
    color: #b5883b;
    cursor: pointer;
}
.back-btn {
    background: #c99b48;
    border: none;
    color: white;
    padding: 0.5rem 1rem;
    border-radius: 30px;
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
}
.back-btn:active { transform: scale(0.97); }
.grid-container {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 0.75rem;
    margin: 0.75rem 0 1.5rem 0;
}
.cell { position: relative; }
.grid-btn {
    width: 100%;
    background: #ffffff;
    border: 2px solid #e6e2d8;
    border-radius: 18px;
    padding: 1rem;
    font-size: 1rem;
    font-weight: 600;
    color: #2d2d2d;
    cursor: pointer;
    box-shadow: 0 3px 0 #c99b48;
    text-align: center;
    word-break: break-word;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 80px;
    transition: transform 0.15s, box-shadow 0.15s, border-color 0.15s;
}
.grid-btn:hover { border-color: #c99b48; }
.grid-btn:active { transform: translateY(2px); box-shadow: 0 1px 0 #c99b48; }
.textbox-container {
    background: #ffffff;
    border-radius: 24px;
    padding: 1.2rem;
    box-shadow: 0 8px 20px rgba(201,155,72,0.08);
    border: 1px solid #e6e2d8;
    margin: 1rem 0;
}
.textbox-container h2 { font-size: 1.1rem; color: #c99b48; margin-bottom: 0.75rem; }
.text-content { white-space: pre-wrap; color: #2d2d2d; font-size: 1rem; }
.empty-note { font-style: italic; color: #6b6b6b; font-size: 0.9rem; }
.breadcrumb { font-weight: 500; color: #c99b48; flex: 1; min-width: 180px; }
.row { display: flex; align-items: center; gap: 0.75rem; flex-wrap: wrap; }
footer {
    margin-top: auto;
    text-align: center;
    font-size: 0.75rem;
    color: #6b6b6b;
    padding: 1.5rem 0 0.5rem 0;
    border-top: 1px dashed #e6e2d8;
}
.install-wrap { text-align: center; padding: 1rem 0 0.5rem 0; }
.install-btn {
    background: #c99b48;
    color: white;
    border: none;
    padding: 0.8rem 1.6rem;
    border-radius: 30px;
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 3px 0 #b5883b;
    letter-spacing: 0.5px;
}
.install-btn:active { transform: translateY(2px); box-shadow: 0 1px 0 #b5883b; }
.loading-note { text-align: center; padding: 2rem; color: #6b6b6b; font-style: italic; }
@media (max-width: 480px) {
    .grid-container { grid-template-columns: repeat(2, 1fr); }
    .app-title { font-size: 1.3rem; }
}
</style>
</head>
<body>
<div class="app-header">
  <div class="app-title">ApiGuide <small>v1.0 · beekeeping seasons & activities</small></div>
  <div class="editor-bar">
    <select class="lang-select" id="langSelect"></select>
  </div>
</div>
<main id="app">
  <div class="loading-note">Chargement...</div>
</main>

<div class="install-wrap" id="installWrap">
  <button class="install-btn" id="installBtn">⬇ Installer l'application</button>
</div>

<footer>ApiGuide v1.0</footer>

<script>
const GIST_ID = "f4fe8523136960f0289660123aa32cb7";
const GIST_FILENAME = "vespacaution_data.json";
const CACHE_KEY = "apiguide_cache_v2";

const LANGS = ['en','fr','it','de','rm'];
const LANG_LABELS = { en:'English', fr:'Français', it:'Italiano', de:'Deutsch', rm:'Rumantsch' };

function blankLang() {
  const E10 = () => ['', '', '', '', '', '', '', '', '', ''];
  return {
    season: ['', '', '', ''],
    level1: Array.from({ length: 4 }, E10),
    text:   Array.from({ length: 4 }, E10)
  };
}
function blankContent() {
  const c = {};
  LANGS.forEach(l => { c[l] = blankLang(); });
  return c;
}

let CONTENT = blankContent();
let currentLang = localStorage.getItem('apiguide_lang') || 'en';
if (!LANGS.includes(currentLang)) currentLang = 'en';

let s = null, l1 = null;

function resetNav() { s = l1 = null; }
function back() {
  if (l1 !== null) l1 = null;
  else if (s !== null) s = null;
  render();
}
function esc(str) {
  return String(str == null ? '' : str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function currentTitles(level) {
  const C = CONTENT[currentLang] || blankLang();
  if (level === 'season') return C.season;
  if (level === 'level1') return C.level1[s] || [];
  return [];
}

async function loadContent() {
  try {
    const cached = JSON.parse(localStorage.getItem(CACHE_KEY) || "null");
    if (cached && cached.content) {
      CONTENT = normalizeContent(cached.content);
      render();
    }
  } catch (e) {}

  try {
    const res = await fetch(`https://api.github.com/gists/${GIST_ID}`, {
      headers: { 'Accept': 'application/vnd.github.v3+json' }
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    const file = data.files && data.files[GIST_FILENAME];
    if (file && file.content) {
      const parsed = JSON.parse(file.content);
      if (parsed.apiguide) {
        CONTENT = normalizeContent(parsed.apiguide);
        try {
          localStorage.setItem(CACHE_KEY, JSON.stringify({ ts: Date.now(), content: CONTENT }));
        } catch (e) {}
        render();
      }
    }
  } catch (e) {
    console.warn('[ApiGuide] Gist unreachable, using cache.', e);
  }
}

function normalizeContent(raw) {
  const out = blankContent();
  LANGS.forEach(lang => {
    if (raw && raw[lang]) {
      const src = raw[lang];
      if (Array.isArray(src.season) && src.season.length === 4) out[lang].season = src.season.slice();
      if (Array.isArray(src.level1)) {
        out[lang].level1 = src.level1.map(arr => Array.isArray(arr) ? arr.slice(0, 10) : ['', '', '', '', '', '', '', '', '', '']);
      }
      if (Array.isArray(src.text)) {
        out[lang].text = src.text.map(arr => Array.isArray(arr) ? arr.slice(0, 10) : ['', '', '', '', '', '', '', '', '', '']);
      }
    }
  });
  return out;
}

function render() {
  renderLangSwitcher();
  const app = document.getElementById('app');

  if (s !== null && l1 !== null) {
    const text = (CONTENT[currentLang].text[s] || [])[l1] || '';
    app.innerHTML = `
      <div class="row">
        <button class="back-btn" id="backBtn">← Back</button>
        <span class="breadcrumb">${esc(LANG_LABELS[currentLang])} · S${s+1} · ${l1+1}</span>
      </div>
      <div class="textbox-container">
        <h2>📝 Notes</h2>
        ${text && text.length ? `<div class="text-content">${esc(text)}</div>` : `<div class="empty-note">(no text)</div>`}
      </div>
    `;
    document.getElementById('backBtn').onclick = back;
    return;
  }

  let level;
  if (s !== null) level = 'level1';
  else level = 'season';

  const crumbText = {
    season: `${esc(LANG_LABELS[currentLang])} · choose a season`,
    level1: `${esc(LANG_LABELS[currentLang])} · S${s+1} → activity`
  }[level];

  const titles = currentTitles(level);
  let html = '';
  for (let i = 0; i < titles.length; i++) {
    if (titles[i] === null) continue;
    const title = titles[i] || '';
    html += `<div class="cell"><button class="grid-btn" data-i="${i}">${esc(title)}</button></div>`;
  }

  if (html === '') {
    app.innerHTML = `
      <div class="row"><span class="breadcrumb">${crumbText}</span></div>
      <div class="textbox-container">
        <div class="empty-note">Contenu pas encore disponible. Un administrateur doit le publier depuis le panneau comité.</div>
      </div>
    `;
    return;
  }

  app.innerHTML = `
    <div class="row">
      ${level === 'season' ? '' : '<button class="back-btn" id="backBtn">← Back</button>'}
      <span class="breadcrumb">${crumbText}</span>
    </div>
    <div class="grid-container" id="grid" ${level==='season'?'style="grid-template-columns:repeat(2,1fr);"':''}>${html}</div>
  `;
  if (level !== 'season') document.getElementById('backBtn').onclick = back;

  document.querySelectorAll('[data-i]').forEach(b => {
    b.onclick = () => {
      const i = +b.dataset.i;
      if (level === 'season') { s = i; l1 = null; }
      else { l1 = i; }
      render();
    };
  });
}

function renderLangSwitcher() {
  const bar = document.getElementById('langSelect');
  if (!bar) return;
  bar.innerHTML = LANGS.map(l => `<option value="${l}" ${l===currentLang?'selected':''}>${esc(LANG_LABELS[l])}</option>`).join('');
  bar.onchange = (e) => {
    currentLang = e.target.value;
    localStorage.setItem('apiguide_lang', currentLang);
    resetNav();
    render();
  };
}

let deferredInstallPrompt = null;
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); deferredInstallPrompt = e; });

function isIOS() { return /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream; }
function isStandalone() { return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true; }

const installBtn = document.getElementById('installBtn');
if (installBtn) {
  if (isStandalone()) installBtn.style.display = 'none';
  installBtn.addEventListener('click', async () => {
    if (isStandalone()) return;
    if (deferredInstallPrompt) {
      deferredInstallPrompt.prompt();
      await deferredInstallPrompt.userChoice;
      deferredInstallPrompt = null;
      return;
    }
    if (isIOS()) {
      alert("Pour installer sur iPhone/iPad :\n\n1. Ouvrez dans Safari\n2. Bouton Partager\n3. « Sur l'écran d'accueil »\n4. « Ajouter »");
      return;
    }
    alert("Pour installer l'application : ouvrez le menu de votre navigateur (⋮) puis « Installer l'application » ou « Ajouter à l'écran d'accueil ».");
  });
}

resetNav();
render();
loadContent();
</script>
</body>
</html>
